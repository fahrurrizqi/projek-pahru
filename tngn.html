<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: Arial, sans-serif;
        }
        #webcam {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            height: 135px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 10;
            background-color: #111;
        }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            text-align: center;
            z-index: 100;
        }
        #flower-animation {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
            z-index: 20;
            background: #020008;
        }
        #flower-animation.visible {
            display: block;
        }
        #heart-animation {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
            z-index: 40;
            background: #010101;
        }
        #heart-animation.visible {
            display: block;
        }
        #bear-animation {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: radial-gradient(circle, rgba(50, 25, 20, 0.82), rgba(5, 5, 5, 0.96));
        }
        #bear-animation.visible {
            display: flex;
        }
        #bear-animation .bear-reference {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 1;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="error-msg">⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br>Mohon izinkan akses kamera pada browser Anda.</div>

    <video id="webcam" autoplay playsinline muted></video>
    <iframe id="flower-animation" src="bunga.html" title="Animasi bunga"></iframe>
    <iframe id="heart-animation" src="hati.html" title="Animasi hati dan I Love You"></iframe>
    <div id="bear-animation" aria-label="Boneka beruang memegang hati">
        <iframe class="bear-reference" src="beruang.html" title="I love you darling"></iframe>
    </div>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry;
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentColors = new Float32Array(PARTICLE_COUNT * 3);
        let targetColors = new Float32Array(PARTICLE_COUNT * 3);
        
        let activeShapeIndex = 0;
        let threeFingerFrames = 0;
        let nonThreeFingerFrames = 0;
        let flowerAnimationVisible = false;
        let fiveFingerFrames = 0;
        let nonFiveFingerFrames = 0;
        let heartAnimationVisible = false;
        let candidateShapeIndex = 0;
        let candidateShapeFrames = 0;
        let noHandFrames = 0;
        let fourFingerFrames = 0;
        let nonFourFingerFrames = 0;
        let bearAnimationVisible = false;

        
        function getCloudPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 15;
            }
            return pos;
        }

        function getHeartPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = u * 2;
                pos[i * 3] = x * 0.3;
                pos[i * 3 + 1] = y * 0.3;
                pos[i * 3 + 2] = z * 0.3;
            }
            return pos;
        }

        function getBearPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const parts = [
                { x: 0, y: 1.7, rx: 1.6, ry: 1.35, count: 0.34 },
                { x: 0, y: -1.05, rx: 1.75, ry: 1.35, count: 0.32 },
                { x: -1.45, y: 1.65, rx: 0.5, ry: 0.55, count: 0.07 },
                { x: 1.45, y: 1.65, rx: 0.5, ry: 0.55, count: 0.07 },
                { x: -1.65, y: 0.15, rx: 0.75, ry: 0.3, count: 0.06 },
                { x: 1.65, y: 0.15, rx: 0.75, ry: 0.3, count: 0.06 },
                { x: 0, y: 0.15, rx: 0.5, ry: 0.36, count: 0.08 }
            ];
            let particleIndex = 0;
            parts.forEach((part) => {
                const count = Math.floor(PARTICLE_COUNT * part.count);
                for (let i = 0; i < count && particleIndex < PARTICLE_COUNT; i++, particleIndex++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.sqrt(Math.random());
                    pos[particleIndex * 3] = part.x + Math.cos(angle) * part.rx * radius;
                    pos[particleIndex * 3 + 1] = part.y + Math.sin(angle) * part.ry * radius;
                    pos[particleIndex * 3 + 2] = (Math.random() - 0.5) * 0.25;
                }
            });
            while (particleIndex < PARTICLE_COUNT) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.sqrt(Math.random());
                pos[particleIndex * 3] = Math.cos(angle) * 1.6 * radius;
                pos[particleIndex * 3 + 1] = -1.05 + Math.sin(angle) * 1.35 * radius;
                pos[particleIndex * 3 + 2] = (Math.random() - 0.5) * 0.25;
                particleIndex++;
            }
            return pos;
        }

        function getTextPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 120;

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('I LOVE YOU', 300, 75);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const validPixels = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData.data[index] > 128) {
                        validPixels.push({
                            x: (x - canvas.width / 2) * 0.03,
                            y: -(y - canvas.height / 2) * 0.03
                        });
                    }
                }
            }

            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                pos[i * 3] = pt.x + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
            return pos;
        }

    
        function getCloudColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 1] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 2] = 0.5 + Math.random() * 0.5;
            }
            return col;
        }

        function getHeartColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.9 + Math.random() * 0.1;
                col[i * 3 + 1] = 0.05 + Math.random() * 0.15;
                col[i * 3 + 2] = 0.1 + Math.random() * 0.25;
            }
            return col;
        }

        function getBearColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.65 + Math.random() * 0.2;
                col[i * 3 + 1] = 0.25 + Math.random() * 0.15;
                col[i * 3 + 2] = 0.1 + Math.random() * 0.1;
            }
            return col;
        }

        function getTextColor() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.0;
                col[i * 3 + 1] = 1.0;
                col[i * 3 + 2] = 0.8;
            }
            return col;
        }

        const shapes = [
            getCloudPositions(),
            getHeartPositions(),
            getTextPositions(),
            getBearPositions()
        ];

        const shapeColors = [
            getCloudColors(),
            getHeartColors(),
            getTextColor(),
            getBearColors()
        ];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const initialPos = shapes[0];
            const initialCol = shapeColors[0];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPositions[i] = initialPos[i];
                targetPositions[i] = initialPos[i];
                currentColors[i] = initialCol[i];
                targetColors[i] = initialCol[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setShape(shapeIndex) {
            if (activeShapeIndex === shapeIndex) return;
            activeShapeIndex = shapeIndex;
            
            const targetPos = shapes[shapeIndex];
            const targetCol = shapeColors[shapeIndex];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                targetPositions[i] = targetPos[i];
                targetColors[i] = targetCol[i];
            }
        }

        function setStableShape(shapeIndex) {
            if (candidateShapeIndex === shapeIndex) {
                candidateShapeFrames++;
            } else {
                candidateShapeIndex = shapeIndex;
                candidateShapeFrames = 1;
            }
            if (candidateShapeFrames >= 4) setShape(shapeIndex);
        }

        function animate() {
            requestAnimationFrame(animate);

            const positions = geometry.attributes.position.array;
            const colorsAttr = geometry.attributes.color.array;

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * 0.1;
                colorsAttr[i] += (targetColors[i] - colorsAttr[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            if (activeShapeIndex === 2 || activeShapeIndex === 3) {
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 1) {
                particles.rotation.y += 0.01;
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else {
                particles.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function isFingerOpen(landmarks, tipIndex, pipIndex) {
            const tip = landmarks[tipIndex];
            const pip = landmarks[pipIndex];
            const wrist = landmarks[0];
            const tipDistance = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
            const pipDistance = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
            return tip.y < pip.y - 0.015 || tipDistance > pipDistance + 0.035;
        }

        function getFingerState(landmarks) {
            return {
                index: isFingerOpen(landmarks, 8, 6),
                middle: isFingerOpen(landmarks, 12, 10),
                ring: isFingerOpen(landmarks, 16, 14),
                pinky: isFingerOpen(landmarks, 20, 18)
            };
        }

        function isThumbOpen(landmarks) {
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const thumbJoint = landmarks[3];
            return Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y) >
                Math.hypot(thumbJoint.x - wrist.x, thumbJoint.y - wrist.y) + 0.035;
        }

        function detectGesture(landmarks) {
            const fingers = getFingerState(landmarks);

            if (fingers.index && fingers.middle && !fingers.ring && !fingers.pinky) {
                return 2;
            }
            if (fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) {
                return 1;
            }
            if (!fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) {
                return 0;
            }
            if (fingers.index && fingers.middle && fingers.ring && fingers.pinky) {
                return 3;
            }

            return activeShapeIndex;
        }

        function isThreeFingerGesture(landmarks) {
            const fingers = getFingerState(landmarks);
            return fingers.index && fingers.middle && fingers.ring && !fingers.pinky;
        }

        function showFlowerAnimation() {
            if (flowerAnimationVisible) return;
            hideHeartAnimation();
            hideBearAnimation();
            flowerAnimationVisible = true;
            flowerAnimation.classList.add('visible');
            if (flowerAnimation.contentWindow.openMagic) {
                flowerAnimation.contentWindow.resetAnimation();
                flowerAnimation.contentWindow.openMagic();
            }
        }

        function hideFlowerAnimation() {
            flowerAnimationVisible = false;
            flowerAnimation.classList.remove('visible');
        }

        function showHeartAnimation() {
            if (heartAnimationVisible) return;
            hideFlowerAnimation();
            hideBearAnimation();
            heartAnimationVisible = true;
            heartAnimation.classList.add('visible');
            if (heartAnimation.contentWindow.openMagic) {
                heartAnimation.contentWindow.resetAnimation();
            }
        }

        function hideHeartAnimation() {
            heartAnimationVisible = false;
            heartAnimation.classList.remove('visible');
        }

        function isFourFingerGesture(landmarks) {
            const fingers = getFingerState(landmarks);
            return fingers.index && fingers.middle && fingers.ring && fingers.pinky &&
                !isFiveFingerGesture(landmarks);
        }

        function isFiveFingerGesture(landmarks) {
            const fingers = getFingerState(landmarks);
            return isThumbOpen(landmarks) &&
                fingers.index && fingers.middle && fingers.ring && fingers.pinky;
        }

        function showBearAnimation() {
            if (bearAnimationVisible) return;
            hideFlowerAnimation();
            hideHeartAnimation();
            setShape(0);
            bearAnimationVisible = true;
            bearAnimation.classList.add('visible');
        }

        function hideBearAnimation() {
            bearAnimationVisible = false;
            bearAnimation.classList.remove('visible');
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const gestures = results.multiHandLandmarks.map((landmarks) => ({
                    landmarks,
                    shapeIndex: detectGesture(landmarks),
                    isThreeFinger: isThreeFingerGesture(landmarks),
                    isFourFinger: isFourFingerGesture(landmarks),
                    isFiveFinger: isFiveFingerGesture(landmarks)
                }));
                noHandFrames = 0;
                const isFiveFinger = gestures.some((gesture) => gesture.isFiveFinger);
                const isFourFinger = gestures.some((gesture) => gesture.isFourFinger);
                const isThreeFinger = gestures.some((gesture) => gesture.isThreeFinger);
                const shapeIndex = isFiveFinger
                    ? 0
                    : isFourFinger
                    ? 3
                    : gestures.some((gesture) => gesture.shapeIndex === 1)
                        ? 1
                        : gestures.some((gesture) => gesture.shapeIndex === 2)
                            ? 2
                            : 0;
                setStableShape(shapeIndex);

                if (shapeIndex === 0) {
                    hideFlowerAnimation();
                    hideBearAnimation();
                }

                if (isFiveFinger) {
                    fiveFingerFrames++;
                    nonFiveFingerFrames = 0;
                    if (fiveFingerFrames >= 3) showHeartAnimation();
                } else {
                    fiveFingerFrames = 0;
                    nonFiveFingerFrames++;
                    if (nonFiveFingerFrames >= 5) hideHeartAnimation();
                }

                if (isFourFinger && !isFiveFinger) {
                    fourFingerFrames++;
                    nonFourFingerFrames = 0;
                    if (fourFingerFrames >= 3) showBearAnimation();
                } else {
                    fourFingerFrames = 0;
                    nonFourFingerFrames++;
                    if (nonFourFingerFrames >= 5) hideBearAnimation();
                }

                if (isThreeFinger && !isFourFinger) {
                    threeFingerFrames++;
                    nonThreeFingerFrames = 0;
                    if (threeFingerFrames >= 3) showFlowerAnimation();
                } else {
                    threeFingerFrames = 0;
                    nonThreeFingerFrames++;
                    if (nonThreeFingerFrames >= 5) hideFlowerAnimation();
                }
            } else {
                noHandFrames++;
                if (noHandFrames >= 5) {
                    setStableShape(0);
                    hideFlowerAnimation();
                    hideHeartAnimation();
                    hideBearAnimation();
                }
            }
        }

        const videoElement = document.getElementById('webcam');
        const errorMsg = document.getElementById('error-msg');
        const flowerAnimation = document.getElementById('flower-animation');
        const heartAnimation = document.getElementById('heart-animation');
        const bearAnimation = document.getElementById('bear-animation');

        flowerAnimation.addEventListener('load', () => {
            if (flowerAnimationVisible && flowerAnimation.contentWindow.openMagic) {
                flowerAnimation.contentWindow.openMagic();
            }
        });

        heartAnimation.addEventListener('load', () => {
            if (heartAnimationVisible && heartAnimation.contentWindow.openMagic) {
                heartAnimation.contentWindow.openMagic();
            }
        });

        initThreeJS();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                videoElement.srcObject = stream;
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 480,
                    height: 360
                });
                cameraUtils.start();
            })
            .catch((err) => {
                console.error("Akses kamera ditolak/gagal:", err);
                errorMsg.style.display = "block";
            });
    </script>
</body>
</html>
