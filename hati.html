<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Love You - Heart Particles</title>
  <style>
    :root { --pink: #ff3d72; --soft-pink: #ff9ab2; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      background: radial-gradient(circle at 50% 45%, #47051f 0, #090106 42%, #010101 100%);
      color: white;
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .24;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .message {
      position: fixed;
      z-index: 2;
      top: 38%;
      left: 50%;
      width: min(88vw, 720px);
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: clamp(2rem, 6vw, 4.7rem);
      line-height: 1.1;
      letter-spacing: .12em;
      text-shadow: 0 0 8px #fff, 0 0 24px var(--pink), 0 0 56px var(--pink);
      animation: breathe 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .message span { color: var(--soft-pink); }
    .hint {
      position: fixed;
      z-index: 2;
      bottom: 7vh;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.56);
      font: 12px Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes breathe {
      from { opacity: .78; transform: translate(-50%, -50%) scale(.98); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) { .message { animation: none; } }
  </style>
</head>
<body>
  <canvas id="heartCanvas" aria-label="Animasi hati dari partikel"></canvas>
  <div class="message">I <span>LOVE</span> YOU</div>
  <div class="hint">gerakkan kursor atau sentuh layar</div>
  <script>
    const canvas = document.getElementById('heartCanvas');
    const context = canvas.getContext('2d');
    const particles = [];
    const arrows = [];
    const impacts = [];
    const pointer = { x: 0, y: 0, active: false };
    const particleCount = 6200;
    let width = 0;
    let height = 0;
    let heartScale = 1;
    let lastArrow = 0;

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      heartScale = Math.min(width, height) / 31;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      createParticles();
    }

    function createParticles() {
      particles.length = 0;
      for (let index = 0; index < particleCount; index += 1) {
        const t = Math.random() * Math.PI * 2;
        const depth = Math.sqrt(Math.random());
        const heartX = 16 * Math.sin(t) ** 3 * heartScale * depth;
        const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * heartScale * depth;
        particles.push({
          baseX: width / 2 + heartX,
          baseY: height / 2 + heartY,
          phase: Math.random() * Math.PI * 2,
          speed: .008 + Math.random() * .018,
          size: .55 + Math.random() * 1.65,
          hue: Math.random() > .82 ? 340 : 352
        });
      }
    }

    function addArrow(time) {
      if (time - lastArrow < 1450) return;
      lastArrow = time;
      const fromLeft = Math.random() > .5;
      const x = fromLeft ? -120 : width + 120;
      const y = height * (.15 + Math.random() * .7);
      const angle = Math.atan2(height / 2 - y, width / 2 - x);
      arrows.push({ x, y, angle, speed: 7 + Math.random() * 2, life: 0, hit: false });
    }

    function drawArrow(arrow) {
      const length = Math.min(width, height) * .24;
      const tailX = arrow.x - Math.cos(arrow.angle) * length;
      const tailY = arrow.y - Math.sin(arrow.angle) * length;
      context.save();
      context.globalAlpha = Math.max(0, 1 - arrow.life / 180);
      context.shadowBlur = 18;
      context.shadowColor = '#ff8eaa';
      context.strokeStyle = '#fff';
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(tailX, tailY);
      context.lineTo(arrow.x, arrow.y);
      context.stroke();
      context.fillStyle = '#ff5f88';
      context.beginPath();
      context.moveTo(arrow.x, arrow.y);
      context.lineTo(arrow.x - Math.cos(arrow.angle - .45) * 23, arrow.y - Math.sin(arrow.angle - .45) * 23);
      context.lineTo(arrow.x - Math.cos(arrow.angle + .45) * 23, arrow.y - Math.sin(arrow.angle + .45) * 23);
      context.closePath();
      context.fill();
      context.restore();
    }

    function pushParticles(x, y, radius, strength) {
      particles.forEach((particle) => {
        const dx = particle.baseX - x;
        const dy = particle.baseY - y;
        const distance = Math.hypot(dx, dy);
        if (distance < radius && distance > 0) {
          const force = (radius - distance) / radius;
          particle.offsetX = (particle.offsetX || 0) + dx / distance * force * strength;
          particle.offsetY = (particle.offsetY || 0) + dy / distance * force * strength;
        }
      });
    }

    function createImpact() {
      const impact = {
        x: width / 2,
        y: height / 2,
        life: 0,
        sparks: []
      };
      for (let index = 0; index < 95; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 8;
        impact.sparks.push({
          x: impact.x,
          y: impact.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: .8 + Math.random() * 2.2
        });
      }
      impacts.push(impact);
    }

    function drawImpacts() {
      for (let index = impacts.length - 1; index >= 0; index -= 1) {
        const impact = impacts[index];
        impact.life += 1;
        const progress = impact.life / 46;
        const radius = 14 + progress * Math.min(width, height) * .22;
        context.save();
        context.globalAlpha = Math.max(0, 1 - progress);
        context.shadowBlur = 28;
        context.shadowColor = '#ff2e63';
        context.strokeStyle = '#ffb36b';
        context.lineWidth = 3 + (1 - progress) * 4;
        context.beginPath();
        context.arc(impact.x, impact.y, radius, 0, Math.PI * 2);
        context.stroke();
        context.fillStyle = '#ffecb3';
        impact.sparks.forEach((spark) => {
          spark.x += spark.vx;
          spark.y += spark.vy;
          spark.vx *= .96;
          spark.vy *= .96;
          context.beginPath();
          context.arc(spark.x, spark.y, spark.size * (1 - progress * .5), 0, Math.PI * 2);
          context.fill();
        });
        context.restore();
        if (impact.life > 46) impacts.splice(index, 1);
      }
    }

    function animate(time) {
      context.clearRect(0, 0, width, height);
      if (pointer.active) pushParticles(pointer.x, pointer.y, 105, 25);
      particles.forEach((particle) => {
        particle.phase += particle.speed;
        particle.offsetX = (particle.offsetX || 0) * .84;
        particle.offsetY = (particle.offsetY || 0) * .84;
        let x = particle.baseX + Math.cos(particle.phase) * 2.2;
        let y = particle.baseY + Math.sin(particle.phase * .8) * 2.2;
        x += particle.offsetX || 0;
        y += particle.offsetY || 0;
        context.globalAlpha = .55 + Math.sin(particle.phase) * .25;
        context.fillStyle = `hsl(${particle.hue}, 100%, 64%)`;
        context.beginPath();
        context.arc(x, y, particle.size, 0, Math.PI * 2);
        context.fill();
      });
      context.globalAlpha = 1;
      addArrow(time);
      for (let index = arrows.length - 1; index >= 0; index -= 1) {
        const arrow = arrows[index];
        arrow.x += Math.cos(arrow.angle) * arrow.speed;
        arrow.y += Math.sin(arrow.angle) * arrow.speed;
        arrow.life += 1;
        pushParticles(arrow.x, arrow.y, 105, 25);
        if (!arrow.hit && Math.hypot(arrow.x - width / 2, arrow.y - height / 2) < 24) {
          arrow.hit = true;
        }
        drawArrow(arrow);
        if (arrow.life > 180) arrows.splice(index, 1);
      }
      drawImpacts();
      requestAnimationFrame(animate);
    }

    function updatePointer(x, y) {
      pointer.x = x;
      pointer.y = y;
      pointer.active = true;
    }

    function openMagic() { document.body.classList.remove('not-loaded'); }
    function resetAnimation() { arrows.length = 0; impacts.length = 0; createParticles(); openMagic(); }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (event) => updatePointer(event.clientX, event.clientY));
    window.addEventListener('mouseleave', () => { pointer.active = false; });
    window.addEventListener('touchmove', (event) => {
      if (event.touches[0]) updatePointer(event.touches[0].clientX, event.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { pointer.active = false; });
    resize();
    requestAnimationFrame(animate);
    window.addEventListener('load', openMagic);
  </script>
</body>
</html>
